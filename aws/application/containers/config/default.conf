# ================================================
# Mobile Order System - Nginx Server Configuration
# Laravel PHP-FPM Integration with Security
# ================================================

# Upstream PHP-FPM backend
upstream php-fpm {
    server 127.0.0.1:9000;
    keepalive 8;
}

# Main server block
server {
    listen 8080;
    server_name localhost;
    
    # Document root
    root /var/www/html/public;
    index index.php index.html;
    
    # Charset
    charset utf-8;
    
    # Rate limiting
    limit_req zone=general burst=20 nodelay;
    
    # Security: Hide nginx version
    server_tokens off;
    
    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP processing
    location ~ \.php$ {
        # Rate limiting for API endpoints
        location ~ ^/api/ {
            limit_req zone=api burst=50 nodelay;
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            
            # PHP-FPM timeout settings
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 180;
            fastcgi_read_timeout 180;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 8 128k;
            fastcgi_busy_buffers_size 256k;
        }
        
        # Regular PHP processing
        include fastcgi_params;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Security headers for PHP responses
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # Laravel health check
    location /healthcheck.php {
        access_log off;
        include fastcgi_params;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    
    # Static assets optimization
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }
    
    # Security: Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(blade\.php|env|git|log|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block access to Laravel directories
    location ~ ^/(storage|bootstrap|config|database|resources|routes|tests)/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}